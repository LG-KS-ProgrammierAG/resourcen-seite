<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Tileset</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        document.documentElement.setAttribute('data-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        );
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tileset.css">
</head>
<body>
    <a class="back-link" href="index.html">← Zurück</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Theme wechseln">☀️</button>

    <div class="hero">
        <img src="media/guide_bpa_0.png" alt="Pixel Art Tileset">
    </div>
    <div class="hero-section">
        <div class="hero-cta">
            <div class="btn-wrapper">
                <a class="btn" href="https://brackeysgames.itch.io/brackeys-platformer-bundle" target="_blank">Link zum Tileset</a>
            </div>
            <div class="scroll-hint">
                <span>Anleitung</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="guide-section">
    <div class="guide-card">
        <div class="guide-handle"></div>
        <h2>Anleitung</h2>
        <div class="steps">
            <div class="step">
                <span class="step-label">Schritt 1</span>
                <img src="media/guide_bpa_1.png" alt="Schritt 1">
            </div>
            <div class="step">
                <span class="step-label">Schritt 2</span>
                <img src="media/guide_bpa_2.png" alt="Schritt 2">
            </div>
            <div class="step">
                <span class="step-label">Schritt 3</span>
                <img src="media/guide_bpa_3.png" alt="Schritt 3">
            </div>
        </div>
    </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
